<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Hector Torrents Ramirez">
    <title>Ejercicio 4 - Formas Geométricas con CSS (cajas.html)</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 50px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .contenedor-figuras {
        display: flex;
        gap: 80px;
        align-items: flex-start;
      }

      .columna {
        display: flex;
        flex-direction: column;
        gap: 30px;
        align-items: center;
      }

      .cuadrado-cuatro-colores {
        width: 100px;
        height: 100px;
        box-sizing: border-box;
        border-top: 50px solid blue;
        border-right: 50px solid yellow;
        border-bottom: 50px solid #2ea44f;
        border-left: 50px solid red;
      }

      .figura-k-grande {
        width: 200px;
        height: 250px;
        position: relative;
      }
      .k-rojo {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-top: 125px solid transparent;
        border-bottom: 125px solid transparent;
        border-left: 100px solid red;
      }
      .k-azul {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        border-top: 100px solid blue;
        border-right: 100px solid blue;
        border-bottom: 100px solid transparent;
        border-left: 100px solid transparent;
      }
      .k-verde {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 0;
        border-top: 100px solid transparent;
        border-right: 100px solid #2ea44f;
        border-bottom: 100px solid #2ea44f;
        border-left: 100px solid transparent;
      }

      .triangulo-inferior-azul {
        width: 0;
        height: 0;
        border-left: 90px solid transparent;
        border-right: 90px solid transparent;
        border-top: 90px solid blue;
      }

      
      .circulo-verde {
        width: 110px;
        height: 110px;
        background-color: #42b883;
        border-radius: 50%;
      }

      .semicirculo-vertical {
        width: 55px;
        height: 110px;
        background-color: #42b883;
        border-radius: 110px 0 0 110px;
      }

      .semicirculo-horizontal {
        width: 110px;
        height: 55px;
        background-color: #42b883;
        border-radius: 0 0 110px 110px;
      }
    </style>
  </head>
  <body>

    <div class="contenedor-figuras">
      <div class="columna">
        <div class="cuadrado-cuatro-colores"></div>

        <div class="figura-k-grande">
          <div class="k-rojo"></div>
          <div class="k-azul"></div>
          <div class="k-verde"></div>
        </div>

        <div class="triangulo-inferior-azul"></div>
      </div>

      <div class="columna">
        <div class="circulo-verde"></div>
        <div class="semicirculo-vertical"></div>
        <div class="semicirculo-horizontal"></div>
      </div>
    </div>

  </body>
</html>
